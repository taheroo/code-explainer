<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="620" viewBox="0 0 1060 620" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="30" font-size="18" font-weight="bold" fill="#1e293b">Code Explorer — Architecture</text>

  <!-- Query flow: User -> FastAPI -->
  <rect x="30" y="140" width="120" height="60" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="90" y="170" text-anchor="middle" font-size="14" fill="#0c4a6e">User</text>
  <text x="90" y="187" text-anchor="middle" font-size="12" fill="#0c4a6e">(plain English Q)</text>

  <rect x="210" y="140" width="130" height="60" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="275" y="170" text-anchor="middle" font-size="14" fill="#312e81">FastAPI</text>
  <text x="275" y="187" text-anchor="middle" font-size="12" fill="#312e81">(Railway)</text>

  <!-- embedders -->
  <rect x="420" y="70" width="170" height="60" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="505" y="100" text-anchor="middle" font-size="14" fill="#6b21a8">BGE-small</text>
  <text x="505" y="117" text-anchor="middle" font-size="12" fill="#6b21a8">Embedder</text>

  <rect x="420" y="220" width="170" height="60" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="505" y="250" text-anchor="middle" font-size="14" fill="#6b21a8">Token</text>
  <text x="505" y="267" text-anchor="middle" font-size="12" fill="#6b21a8">Sparse Embedder</text>

  <!-- vector db + llm -->
  <rect x="650" y="140" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="740" y="170" text-anchor="middle" font-size="14" fill="#14532d">Qdrant Cloud</text>
  <text x="740" y="187" text-anchor="middle" font-size="12" fill="#14532d">Hybrid Search</text>

  <rect x="890" y="140" width="130" height="60" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="955" y="170" text-anchor="middle" font-size="14" fill="#7c2d12">Groq</text>
  <text x="955" y="187" text-anchor="middle" font-size="12" fill="#7c2d12">LLM</text>

  <!-- arrows: query flow -->
  <line x1="150" y1="155" x2="208" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="147" text-anchor="middle" font-size="11" fill="#64748b">POST /query</text>

  <line x1="340" y1="155" x2="418" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="384" y="115" text-anchor="middle" font-size="11" fill="#64748b">embed query</text>

  <line x1="340" y1="185" x2="418" y2="235" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="384" y="225" text-anchor="middle" font-size="11" fill="#64748b">sparse embed</text>

  <line x1="590" y1="110" x2="648" y2="155" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="620" y="120" text-anchor="middle" font-size="11" fill="#64748b">dense vector</text>

  <line x1="590" y1="240" x2="648" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="620" y="225" text-anchor="middle" font-size="11" fill="#64748b">sparse vector</text>

  <line x1="830" y1="170" x2="888" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="860" y="163" text-anchor="middle" font-size="11" fill="#64748b">top chunks</text>

  <!-- LLM -> FastAPI (answer), top route -->
  <polyline points="955,140 955,20 275,20 275,138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="615" y="13" text-anchor="middle" font-size="11" fill="#64748b">answer</text>

  <!-- FastAPI -> User (answer) -->
  <line x1="210" y1="185" x2="152" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="180" y="197" text-anchor="middle" font-size="11" fill="#64748b">answer</text>

  <!-- Ingest subgraph -->
  <rect x="70" y="430" width="480" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="82" y="452" font-size="13" font-weight="bold" fill="#475569">Ingest Pipeline</text>

  <rect x="100" y="480" width="160" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="180" y="510" text-anchor="middle" font-size="14" fill="#334155">GitHub Repo</text>
  <text x="180" y="527" text-anchor="middle" font-size="12" fill="#334155">(auto-cloned)</text>

  <rect x="330" y="480" width="180" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="420" y="510" text-anchor="middle" font-size="14" fill="#713f12">AST/Regex</text>
  <text x="420" y="527" text-anchor="middle" font-size="12" fill="#713f12">Chunker</text>

  <!-- ingest arrows -->
  <line x1="260" y1="510" x2="328" y2="510" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="294" y="503" text-anchor="middle" font-size="11" fill="#64748b">clone</text>

  <line x1="430" y1="480" x2="430" y2="282" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="437" y="380" text-anchor="start" font-size="11" fill="#64748b">chunks</text>

  <line x1="490" y1="480" x2="490" y2="132" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="497" y="300" text-anchor="start" font-size="11" fill="#64748b">chunks</text>
</svg>
